- type: Features
  data:
  - name: Business Search
    description: Search up to 240 businesses by location, term, category, price, and
      attributes.
  - name: Business Details
    description: Retrieve rich detail for a business by id or alias, including hours,
      photos, and attributes.
  - name: Reviews
    description: Retrieve review excerpts, ratings, and reviewer details for a business.
  - name: Autocomplete
    description: Return search-term, business, and category suggestions as the user
      types.
  - name: Phone and Address Match
    description: Resolve a phone number or postal address to Yelp businesses.
  - name: Events
    description: Search and retrieve local events with timing, location, cost, and
      ticketing.
  - name: Category Taxonomy
    description: Access the full Yelp business category list and per-category details.
  - name: Fusion AI
    description: Natural language, multi-turn conversational search and business questions.
- type: UseCases
  data:
  - name: Restaurant Discovery
    description: Power restaurant and food discovery experiences with search, ratings,
      and photos.
  - name: Location-Aware Recommendations
    description: Surface nearby, open, and highly-rated businesses based on user coordinates.
  - name: Reputation Monitoring
    description: Track ratings and review excerpts for a portfolio of businesses.
  - name: Conversational Concierge
    description: Build AI agents that answer natural language questions about local
      businesses.
  - name: Local Events Listings
    description: Embed curated local event listings into apps and sites.
- type: Integrations
  data:
  - name: Zapier
    description: Yelp Leads and Conversions APIs offer Zapier integrations for no-code
      workflows.
  - name: Model Context Protocol
    description: Official Yelp MCP server exposes Fusion AI as an agent tool over
      MCP.
  - name: Webhooks
    description: Reviews and Leads webhooks push real-time events to partner endpoints.
